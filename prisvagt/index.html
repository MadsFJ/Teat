<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prisvagt</title>
<style>
  :root { --bg:#faf7f2; --fg:#2b2118; --muted:#7a6a5a; --card:#fff; --line:#e6ddd0; --accent:#b5651d; --good:#2e7d32; --bad:#c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1612; --fg:#f1e9df; --muted:#a8998a; --card:#262019; --line:#3a3128; --accent:#e0954d; --good:#7fc782; --bad:#ef7b7b; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px; }
  h1 { margin:0 0 4px; } .muted { color:var(--muted); font-size:14px; }
  .best { font-size:28px; font-weight:700; color:var(--accent); margin:16px 0 0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-top:16px; }
  .row { display:flex; justify-content:space-between; gap:12px; align-items:baseline; flex-wrap:wrap; }
  .row a { color:var(--fg); font-weight:600; } .pris { font-weight:700; font-size:20px; }
  .ned { color:var(--good); } .op { color:var(--bad); } .fejl { color:var(--bad); font-size:14px; }
  svg { width:100%; height:120px; display:block; margin-top:8px; }
</style>
</head>
<body>
<main>
  <h1>🥃 Prisvagt</h1>
  <div class="muted" id="info">Henter…</div>
  <div class="best" id="best"></div>
  <div id="liste"></div>
</main>
<script>
const kr = p => p.toLocaleString('da-DK', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' kr';
const dato = s => new Date(s).toLocaleString('da-DK', { dateStyle: 'medium', timeStyle: 'short' });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

function graf(priser) {
  if (priser.length < 2) return '';
  const t = priser.map(p => +new Date(p.tid)), v = priser.map(p => p.pris);
  const t0 = Math.min(...t), t1 = Math.max(Date.now(), ...t), lo = Math.min(...v), hi = Math.max(...v);
  const x = a => 4 + (a - t0) / (t1 - t0 || 1) * 592, y = a => 110 - (a - lo) / (hi - lo || 1) * 100;
  // Trappekurve: prisen gælder indtil næste ændring.
  let d = `M${x(t[0])},${y(v[0])}`;
  for (let i = 1; i < v.length; i++) d += ` H${x(t[i])} V${y(v[i])}`;
  d += ` H${x(t1)}`;
  return `<svg viewBox="0 0 600 120" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
    <div class="row muted"><span>${dato(t0)}</span><span>lavest ${kr(lo)} · højest ${kr(hi)}</span></div>`;
}

fetch('historik.json', { cache: 'no-store' }).then(r => r.json()).then(h => {
  document.title = 'Prisvagt – ' + h.produkt;
  document.querySelector('h1').textContent = '🥃 ' + h.produkt;
  document.getElementById('info').textContent = 'Sidst tjekket ' + dato(h.opdateret) + (h.maalpris ? ' · målpris ' + kr(h.maalpris) : '');
  const butikker = Object.entries(h.butikker);
  const aktuelle = butikker.map(([, b]) => b.priser.at(-1)?.pris).filter(p => p != null);
  if (aktuelle.length) document.getElementById('best').textContent = 'Bedste pris: ' + kr(Math.min(...aktuelle));
  document.getElementById('liste').innerHTML = butikker.map(([url, b]) => {
    const nu = b.priser.at(-1), før = b.priser.at(-2);
    const ændring = nu && før ? `<span class="${nu.pris < før.pris ? 'ned' : 'op'}">${nu.pris < før.pris ? '▼' : '▲'} fra ${kr(før.pris)}</span>` : '';
    return `<div class="card">
      <div class="row"><a href="${esc(url)}" target="_blank" rel="noopener">${esc(b.navn)}</a>
        <span class="pris">${nu ? kr(nu.pris) : '–'}</span></div>
      <div class="row muted"><span>${nu ? 'siden ' + dato(nu.tid) : 'ingen pris endnu'}</span>${ændring}</div>
      ${b.fejl ? `<div class="fejl">Seneste tjek fejlede: ${esc(b.fejl)}</div>` : ''}
      ${graf(b.priser)}
    </div>`;
  }).join('');
}).catch(() => { document.getElementById('info').textContent = 'Ingen prisdata endnu – kør workflowet "Prisvagt" under Actions.'; });
</script>
</body>
</html>
