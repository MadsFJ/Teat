# Udgiver repo'et på GitHub Pages og henter Driftsradars statusdata fra en server,
# så siden ikke bliver blokeret af CORS. Kræver at Settings → Pages → Source
# er sat til "GitHub Actions".
name: Driftsradar – hent status og udgiv

on:
  schedule:
    - cron: '*/10 * * * *'
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pushes udgives kun fra standardbranchen; schedule kører altid på den.
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Byg site
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/
      - name: Hent status
        run: node driftsradar/hent-status.mjs _site/driftsradar/status.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
