<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lyt</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    color-scheme: light dark;
    --bg:#f4f6f5;
    --surface:#ffffff;
    --surface-2:#eaf0ee;
    --border:#d5deda;
    --text:#0f1a1a;
    --text-muted:#546462;
    --accent:#0b8f7c;
    --accent-contrast:#ffffff;
    --accent-amber:#a86a09;
    --danger:#ad2c22;
    --scope-shadow: inset 0 0 0 1px var(--border), inset 0 2px 10px rgba(15,26,26,.06);
    --font-display:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --font-body:'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0a0e10;
      --surface:#11181a;
      --surface-2:#172023;
      --border:#263133;
      --text:#e9f2f0;
      --text-muted:#87999b;
      --accent:#52e0c4;
      --accent-contrast:#06231d;
      --accent-amber:#f6ad3c;
      --danger:#ff6b60;
      --scope-shadow: inset 0 0 0 1px var(--border), inset 0 2px 14px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0a0e10;
    --surface:#11181a;
    --surface-2:#172023;
    --border:#263133;
    --text:#e9f2f0;
    --text-muted:#87999b;
    --accent:#52e0c4;
    --accent-contrast:#06231d;
    --accent-amber:#f6ad3c;
    --danger:#ff6b60;
    --scope-shadow: inset 0 0 0 1px var(--border), inset 0 2px 14px rgba(0,0,0,.35);
  }

  *{ box-sizing:border-box; }
  html, body{ margin:0; background:var(--bg); }
  body{
    min-height:100vh;
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    padding:40px 20px 48px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
  }

  .hero{ text-align:center; display:flex; flex-direction:column; gap:8px; }
  .eyebrow{
    margin:0;
    font-family:var(--font-display);
    font-size:12px;
    letter-spacing:.14em;
    color:var(--accent);
    font-weight:600;
  }
  h1{
    margin:0;
    font-family:var(--font-display);
    font-size:clamp(30px, 9vw, 40px);
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .lede{
    margin:0;
    max-width:38ch;
    color:var(--text-muted);
    font-size:15px;
    line-height:1.6;
  }

  .listen-btn{
    appearance:none;
    border:none;
    width:180px;
    height:180px;
    border-radius:50%;
    background:var(--accent);
    color:var(--accent-contrast);
    font-family:var(--font-display);
    font-size:20px;
    font-weight:700;
    letter-spacing:.02em;
    cursor:pointer;
    box-shadow:0 0 0 6px var(--surface-2), 0 8px 24px rgba(11,143,124,.28);
    transition:transform .12s ease;
  }
  .listen-btn:active{ transform:scale(.96); }
  .listen-btn:disabled{ opacity:.55; cursor:not-allowed; }
  .listen-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:4px; }

  .capture{ width:100%; display:flex; flex-direction:column; align-items:center; gap:12px; }
  .capture-meta{ display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-size:14px; }
  .rec-dot{
    width:9px; height:9px; border-radius:50%;
    background:var(--danger);
    flex:none;
    animation:pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
  @media (prefers-reduced-motion:reduce){ .rec-dot{ animation:none; } }
  #timer{ font-variant-numeric:tabular-nums; min-width:32px; }
  .level-meter{ width:160px; height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden; box-shadow:inset 0 0 0 1px var(--border); }
  .level-fill{ height:100%; width:0%; background:linear-gradient(90deg, var(--accent), var(--accent-amber)); }
  .scope{
    display:block;
    width:100%;
    max-width:400px;
    height:64px;
    background:var(--surface-2);
    border-radius:8px;
    box-shadow:var(--scope-shadow);
  }

  .status{
    font-family:var(--font-display);
    font-size:13px;
    padding:10px 14px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    text-align:center;
  }
  .status-error{ border-color:var(--danger); color:var(--danger); }

  .result{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
    display:flex;
    gap:16px;
    align-items:center;
  }
  .result-none{ border-color:var(--danger); flex-direction:column; text-align:center; }
  .result-art{
    width:72px; height:72px; border-radius:10px;
    background:var(--surface-2);
    box-shadow:inset 0 0 0 1px var(--border);
    flex:none;
    object-fit:cover;
  }
  .result-body{ display:flex; flex-direction:column; gap:4px; min-width:0; }
  .result-title{ margin:0; font-size:17px; font-weight:700; overflow-wrap:break-word; }
  .result-artist{ margin:0; font-size:14px; color:var(--text-muted); overflow-wrap:break-word; }
  .result-links{ display:flex; gap:12px; margin-top:6px; flex-wrap:wrap; }
  .result-links a{ font-family:var(--font-display); font-size:12px; color:var(--accent); text-decoration:none; border-bottom:1px solid var(--accent); }

  .footnote{ margin-top:auto; text-align:center; }
  .footnote p{ margin:0; font-size:12px; line-height:1.6; color:var(--text-muted); max-width:38ch; }

  @media (max-width:360px){
    .listen-btn{ width:150px; height:150px; font-size:18px; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="hero">
    <p class="eyebrow">MUSIKGENKENDELSE</p>
    <h1>Lyt</h1>
    <p class="lede">Tryk på knappen, hold telefonen mod lydkilden i et par sekunder — vi finder ud af hvad der spiller.</p>
  </header>

  <button type="button" class="listen-btn" id="listenBtn">Lyt</button>

  <div class="capture" id="captureRow" hidden>
    <div class="capture-meta">
      <span class="rec-dot" aria-hidden="true"></span>
      <span id="timer">0:07</span>
      <div class="level-meter"><div class="level-fill" id="levelFill"></div></div>
    </div>
    <canvas class="scope" id="liveCanvas" width="400" height="64"></canvas>
  </div>

  <div id="statusBar" class="status" hidden></div>

  <div id="result" class="result" hidden></div>

  <footer class="footnote">
    <p>Lyden sendes til AudD's genkendelsestjeneste for at finde sangen — den gemmes ikke af denne side.</p>
  </footer>
</div>

<script>
(function () {
  "use strict";

  // AudD.io recognition — https://docs.audd.io/
  var AUDD_API_TOKEN = "9deacabd87e6ffbe2995b0633844aa39";
  var AUDD_ENDPOINT = "https://api.audd.io/";
  var LISTEN_DURATION_SEC = 7;

  var el = {};
  ["listenBtn", "captureRow", "timer", "levelFill", "liveCanvas", "statusBar", "result"].forEach(function (id) {
    el[id] = document.getElementById(id);
  });

  function showStatus(msg, type) {
    el.statusBar.textContent = msg;
    el.statusBar.className = "status" + (type ? " status-" + type : "");
    el.statusBar.hidden = false;
  }
  function hideStatus() { el.statusBar.hidden = true; }

  function formatTime(sec) {
    sec = Math.max(0, sec);
    var m = Math.floor(sec / 60);
    var s = Math.floor(sec % 60);
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  // Simple live bar visualizer — purely for feedback while recording,
  // driven by an AnalyserNode running in parallel with the recorder.
  function drawLiveSpectrum(canvas, dataArray) {
    var ctx = canvas.getContext("2d");
    var w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    var accent = cssVar("--accent");
    var barCount = Math.min(dataArray.length, 64);
    var barWidth = w / barCount;
    for (var i = 0; i < barCount; i++) {
      var v = dataArray[i] / 255;
      var barH = v * h;
      ctx.fillStyle = accent;
      ctx.globalAlpha = 0.35 + v * 0.65;
      ctx.fillRect(i * barWidth, h - barH, Math.max(1, barWidth - 1), barH);
    }
    ctx.globalAlpha = 1;
  }

  function computeLevel(dataArray) {
    var sum = 0;
    for (var i = 0; i < dataArray.length; i++) sum += dataArray[i];
    return sum / dataArray.length / 255;
  }

  function pickMimeType() {
    var candidates = ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus", "audio/mp4"];
    for (var i = 0; i < candidates.length; i++) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(candidates[i])) {
        return candidates[i];
      }
    }
    return "";
  }

  function handleMicError(err) {
    var msg;
    if (err && (err.name === "NotAllowedError" || err.name === "PermissionDeniedError")) {
      msg = "Mikrofon-adgang blev afvist. Tillad mikrofon for denne side og prøv igen.";
    } else if (err && err.name === "NotFoundError") {
      msg = "Fandt ingen mikrofon på denne enhed.";
    } else if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      msg = "Denne browser understøtter ikke mikrofon-optagelse.";
    } else {
      msg = "Kunne ikke tilgå mikrofonen (" + ((err && err.message) || (err && err.name) || "ukendt fejl") + ").";
    }
    showStatus(msg, "error");
  }

  // Sends the captured clip to AudD's recognition API and normalizes the
  // response. See https://docs.audd.io/ for the request/response shape.
  function identifyWithAudD(blob) {
    var form = new FormData();
    form.append("api_token", AUDD_API_TOKEN);
    form.append("file", blob, "clip.webm");
    form.append("return", "apple_music,spotify");
    return fetch(AUDD_ENDPOINT, { method: "POST", body: form })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.status === "error") {
          throw new Error((data.error && data.error.error_message) || "AudD returnerede en fejl.");
        }
        return data.result || null;
      });
  }

  function artworkUrlFor(result) {
    if (result.apple_music && result.apple_music.artwork && result.apple_music.artwork.url) {
      return result.apple_music.artwork.url.replace("{w}", "300").replace("{h}", "300");
    }
    if (result.spotify && result.spotify.album && result.spotify.album.images && result.spotify.album.images.length) {
      return result.spotify.album.images[0].url;
    }
    return null;
  }

  function renderResult(result) {
    el.result.hidden = false;
    el.result.innerHTML = "";
    if (!result) {
      el.result.className = "result result-none";
      var t = document.createElement("p");
      t.className = "result-title";
      t.textContent = "Ingen match fundet";
      var s = document.createElement("p");
      s.className = "result-artist";
      s.textContent = "Prøv at holde telefonen tættere på lydkilden og prøv igen.";
      el.result.appendChild(t);
      el.result.appendChild(s);
      return;
    }

    el.result.className = "result";
    var art = artworkUrlFor(result);
    if (art) {
      var img = document.createElement("img");
      img.className = "result-art";
      img.src = art;
      img.alt = "";
      el.result.appendChild(img);
    }

    var body = document.createElement("div");
    body.className = "result-body";
    var title = document.createElement("p");
    title.className = "result-title";
    title.textContent = result.title || "Ukendt titel";
    var artist = document.createElement("p");
    artist.className = "result-artist";
    artist.textContent = result.artist || "Ukendt kunstner";
    body.appendChild(title);
    body.appendChild(artist);

    var links = document.createElement("div");
    links.className = "result-links";
    if (result.spotify && result.spotify.external_urls && result.spotify.external_urls.spotify) {
      var sLink = document.createElement("a");
      sLink.href = result.spotify.external_urls.spotify;
      sLink.target = "_blank";
      sLink.rel = "noopener";
      sLink.textContent = "Spotify";
      links.appendChild(sLink);
    }
    if (result.apple_music && result.apple_music.url) {
      var aLink = document.createElement("a");
      aLink.href = result.apple_music.url;
      aLink.target = "_blank";
      aLink.rel = "noopener";
      aLink.textContent = "Apple Music";
      links.appendChild(aLink);
    }
    if (links.childNodes.length) body.appendChild(links);

    el.result.appendChild(body);
  }

  el.listenBtn.addEventListener("click", function () {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { handleMicError(null); return; }

    el.result.hidden = true;
    hideStatus();
    el.listenBtn.disabled = true;

    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      var AudioCtx = window.AudioContext || window.webkitAudioContext;
      var audioCtx = new AudioCtx();
      var source = audioCtx.createMediaStreamSource(stream);
      var analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      source.connect(analyser);
      var dataArray = new Uint8Array(analyser.frequencyBinCount);

      var mimeType = pickMimeType();
      var recorder = new MediaRecorder(stream, mimeType ? { mimeType: mimeType } : undefined);
      var chunks = [];
      recorder.addEventListener("dataavailable", function (e) {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      });
      var stopped = new Promise(function (resolve) {
        recorder.addEventListener("stop", function () {
          resolve(new Blob(chunks, { type: mimeType || "audio/webm" }));
        });
      });
      recorder.start();

      el.captureRow.hidden = false;
      var startTime = performance.now();
      var running = true;

      function tick() {
        if (!running) return;
        var elapsed = (performance.now() - startTime) / 1000;
        el.timer.textContent = formatTime(LISTEN_DURATION_SEC - elapsed);
        analyser.getByteFrequencyData(dataArray);
        drawLiveSpectrum(el.liveCanvas, dataArray);
        el.levelFill.style.width = Math.round(computeLevel(dataArray) * 100) + "%";
        if (elapsed < LISTEN_DURATION_SEC) requestAnimationFrame(tick);
      }
      tick();

      setTimeout(function () {
        running = false;
        recorder.stop();
        stopped.then(function (blob) {
          stream.getTracks().forEach(function (t) { t.stop(); });
          audioCtx.close();
          el.captureRow.hidden = true;
          showStatus("Slår sangen op…", "info");
          return identifyWithAudD(blob);
        }).then(function (result) {
          hideStatus();
          renderResult(result);
        }).catch(function (err) {
          showStatus("Kunne ikke slå sangen op (" + (err.message || err) + ").", "error");
        }).then(function () {
          el.listenBtn.disabled = false;
        });
      }, LISTEN_DURATION_SEC * 1000);
    }).catch(function (err) {
      handleMicError(err);
      el.listenBtn.disabled = false;
    });
  });
})();
</script>
</body>
</html>
